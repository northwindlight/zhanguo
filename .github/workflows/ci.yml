name: CI

# 离线全流程：装依赖 → 跑全量回归 → 跑示例巡礼 → 核对文档与代码同步。
# 全程不联网调用模型、不读写真实存档。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: 构建与发版范围
    runs-on: ubuntu-latest
    outputs:
      portable: ${{ steps.scope.outputs.portable }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python -m scripts.ci_release_scope

  windows:
    name: Windows 便携包
    needs: scope
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.portable == 'true'
    uses: ./.github/workflows/windows-portable.yml

  prerelease:
    name: 自动发布试玩版
    needs: [scope, test, docs, desktop, windows]
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: portable-prerelease
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: Zhanguo-Windows-x64
          path: release-input
      - name: 发布同提交的 Windows、源码与校验值
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_portable.py --artifact "$(find release-input -name '*.zip' -print -quit)" --output release-output

  test:
    name: 离线回归
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          # 装全量（含地图 PNG 用的 Pillow）：地图渲染测试在 CI 里要真跑，
          # 不靠"没装 Pillow 就跳过"蒙过去。核心回归本身不依赖 Pillow。
          python -m pip install -r requirements-vision.txt
      - name: 全量离线回归
        run: python -m unittest discover -s tests -q
      - name: 示例巡礼（离线冒烟）
        run: python -m unittest tests.test_examples_tour -v

  docs:
    name: 文档与代码同步
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # API 参考页是生成的：与代码不同步就说明有人改了接口却没重新生成。
      - name: 核对 API 参考页
        run: python3 scripts/api_doc.py --check
      # build.py 自带站内链接自检：有断链就以非零码退出。
      - name: 生成文档站并自检链接
        run: python3 docs/site/build.py
      - name: 配置体检（示例配置应当报出缺密钥，而不是崩）
        run: |
          python3 mp_run.py --config mp_config.example.json --check-config || true
          python3 mp_run.py --config mp_config.minigame.example.json --check-config

  desktop:
    name: Godot C# 编译
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 编译桌面工程
        run: dotnet build mods/ui/desktop/Zhanguo.Desktop.csproj
      - name: 核对地貌样板布局
        run: dotnet run --project tests/desktop-layout/Checks.csproj -- mods/ui/desktop/Samples/terrain-v2.json
