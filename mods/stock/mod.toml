[Distribution]
Id = "stock:exchange"
Version = "1.0.0"
# 模拟炒股发行版：四个模块，一套规则。
#   stock:clock     回合号、交易日历（每 5 个交易日休市 2 天）、两个窗口的动作额度
#   stock:market    股票池、分层价格引擎、挂单簿与撮合
#   stock:portfolio 现金、持仓、借贷、净值曲线、银行强制平仓
#   stock:python    沿用原版 Python 沙盒（experimental:python 的股市版）
Members = ["mods/clock.toml", "mods/market.toml", "mods/portfolio.toml", "mods/python.toml"]
RequiredState = ["clock", "market", "portfolio", "scripts"]
ActorCollection = "nation_actors"
ActionGate = {Capability = "stock:clock", Method = "can_act"}
PlayerClock = {Capability = "stock:clock", Method = "period"}
# 回合开局自动给模型的事实：持仓与财富、行情、上回合脚本结果、回合日历与额度。
PlayerState = ["portfolio", "market", "script_status", "round"]

[Distribution.Tools]
Entry = "mods.stock.tools:build"

[Distribution.ClientFactories.llm]
Entry = "mods.stock.client:StockClient"
Configuration = "mods.stock.config:normalize"

# 离线可跑：不需要模型与 API key 的简易策略客户端。
[Distribution.ClientFactories.sim]
Entry = "mods.stock.client:SimClient"

# 回放客户端：按玩家配置里的 scripts 表逐回合跑指定脚本，用于演示与验收。
[Distribution.ClientFactories.replay]
Entry = "mods.stock.client:ReplayClient"

[Distribution.Session]
Entry = "mods.stock.session:StockSession"

[Distribution.Configuration]
Entry = "mods.stock.config:normalize"

# 脚本执行服务沿用原版：脚本跑在沙盒里，回执由服务补齐。
[Distribution.Session.Services.scripts]
Entry = "mods.experimental.scripting:ScriptService"
[Distribution.Session.Services.scripts.Services.programs]
Capability = "sandbox:programs"
Methods = ["finish"]

[[Hooks]]
Id = "market.settlement"
Name = "撮合与结算"
Description = "按本回合收盘价撮合全部挂单（含冲击成本），按订单流滚动下一回合行情，并结算利息、追保与银行强制平仓。"

[[Hooks]]
Id = "cycle.end"
Name = "回合推进"
Description = "结束本回合，重置两个窗口的动作额度，进入下一回合。"
