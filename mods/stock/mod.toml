[Distribution]
Id = "stock:exchange"
Version = "2.2.0"
# PAMS交互市场、券商、共同tick、计算槽、算力租赁与商业谍报。
Members = ["mods/clock.toml", "mods/market.toml", "mods/portfolio.toml", "mods/python.toml", "mods/compute.toml", "mods/intelligence.toml"]
RequiredState = ["clock", "market", "portfolio", "scripts", "compute", "intelligence"]
ActorCollection = "nation_actors"
ActionGate = {Capability = "stock:clock", Method = "can_act"}
PlayerClock = {Capability = "stock:clock", Method = "period"}
# 回合开局自动给模型的事实：持仓与财富、行情、股票池、昨日执行回执、上回合脚本结果、回合日历与额度。
PlayerState = ["portfolio", "market", "pool", "day_report", "script_status", "round", "compute_status", "intel_status"]

[Distribution.Tools]
Entry = "mods.stock.tools:build"

[Distribution.ClientFactories.llm]
Entry = "mods.stock.client:StockClient"
Configuration = "mods.stock.config:normalize"

# 离线可跑：不需要模型与 API key 的简易策略客户端。
[Distribution.ClientFactories.sim]
Entry = "mods.stock.client:SimClient"

# 回放客户端：按玩家配置里的 scripts 表逐回合跑指定脚本，用于演示与验收。
[Distribution.ClientFactories.replay]
Entry = "mods.stock.client:ReplayClient"

[Distribution.Session]
Entry = "mods.stock.session:StockSession"

[Distribution.Configuration]
Entry = "mods.stock.config:normalize"

[[Hooks]]
Id = "market.settlement"
Name = "撮合与结算"
Description = "PAMS共同时间线：盘中撮合并立即记账，收盘结算费用和风险。"

[[Hooks]]
Id = "cycle.end"
Name = "回合推进"
Description = "推进日历，重置规划及共享计算预算，续租资源。"
