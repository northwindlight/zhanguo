[Mod]
Id = "stock:portfolio"
Version = "2.0.0"
Entry = "mods.stock.portfolio:PortfolioMod"
Requires = ["stock:clock"]
[State]
Owns = ["portfolio"]
[Capabilities]
Needs = ["stock:market", "stock:clock"]
Provides = ["stock:portfolio"]
[Interfaces]
"stock:market" = ["price_of", "name_of", "borrow_limit", "cancel_actor", "liquidate"]
"stock:clock" = ["charge"]
[Parameters]
InitialCash = 100000
InterestRate = 0.02
MarginRatio = 0.5
BaseCreditRatio = 0.5
ShortInitialMargin = 0.5
ShortMaintenance = 0.3
BorrowRate = 0.0002
[PlayerAPI]
Methods = ["holdings", "borrow", "repay", "equity_curve"]
ReadOnly = ["holdings", "equity_curve"]
