[Mod]
Id = "stock:portfolio"
Version = "1.0.0"
Entry = "mods.stock.portfolio:PortfolioMod"
Requires = ["stock:clock"]

[State]
Owns = ["portfolio"]

[Capabilities]
Needs = ["stock:clock", "stock:market"]
Provides = ["stock:portfolio"]

[Interfaces]
"stock:clock" = ["period", "charge"]
"stock:market" = ["price_of", "name_of", "sell_quote", "fills"]

[Parameters]
# 初始资金。
InitialCash = 100000
# 每回合利息：按未偿贷款本金的 2% 计，回合末扣现金。
InterestRate = 0.02
# 追保线：负债超过持仓市值的 50%，银行强制平仓。
MarginRatio = 0.5
# 基础授信：初始资金的 50%，随时可借；超过后需要先有可抵押的持仓。
BaseCreditRatio = 0.5

[PlayerAPI]
Methods = ["holdings", "borrow", "repay", "equity_curve"]
ReadOnly = ["holdings", "equity_curve"]
