[Mod]
Id = "stock:python"
Version = "2.0.0"
Entry = "mods.stock.python:StockPythonMod"
Requires = ["stock:clock", "stock:compute", "stock:portfolio"]
[State]
Owns = ["scripts"]
[Capabilities]
Needs = ["stock:clock", "stock:market", "stock:compute", "stock:portfolio"]
Provides = ["sandbox:programs"]
[Interfaces]
"stock:clock" = ["charge"]
"stock:market" = ["open_session", "advance", "freeze_public"]
"stock:compute" = ["status", "consume"]
"stock:portfolio" = ["holdings", "spend"]
[Parameters]
WakeInterval = 100
BurstSteps = 50000
BurstCalls = 200
ResearchSteps = 1000000
ResearchCalls = 1000
[Limits]
steps = 4000000
calls = 4000
source = 16384
nodes = 2048
items = 4096
string = 65536
value_bytes = 1048576
output = 4096
depth = 48
integer_bits = 256
[PlayerAPI]
Methods = ["write", "patch", "check", "status", "run"]
ReadOnly = ["check", "status"]
