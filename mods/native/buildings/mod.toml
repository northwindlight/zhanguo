[Mod]
Id = "native:buildings"
Version = "2.2.0"
Entry = "mods.native.buildings.mod:BuildingsMod"
Requires = ["native:resources"]
After = ["native:resources"]

[State]
Owns = ["buildings"]
Requests = []

[Capabilities]
Needs = ["native:resource-exchange"]
Provides = ["native:buildings"]

[Interfaces]
"native:resource-exchange" = ["snapshot", "exchange", "exchange_batch"]

[[Stages]]
Id = "native:buildings.produce"
Handler = "produce"
Hook = "buildings.production"
Provides = ["buildings.produced"]

[[Stages]]
Id = "native:buildings.complete"
Handler = "complete"
Hook = "buildings.completion"
Needs = ["buildings.produced"]
Provides = ["buildings.completed"]
