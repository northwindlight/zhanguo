ToolNames = ["build"]
[Mod]
Id = "buildings"
Version = "1.0.0"
Entry = "mods.native.buildings.mod:BuildingsMod"
Requires = []

[State]
Requests = ["flow_in", "flow_out", "ledger", "nations", "spend", "tiles"]
Owns = ["diplo_built", "energy_report", "grid_short"]

[Capabilities]
Needs = ["method._ledger", "method._ledger_runrate_mark", "method._mval", "method._reachable", "method._spend", "method.add_res", "method.alive", "method.polity_rule", "method.res", "method.troops", "method.visible_to", "method.war_between", "number.EXTRA_PROMPT_TURNS", "number.GRID_RESERVE_WARN", "number.HEAL_EQUIP_COST", "number.MARKET", "number.TERRAIN_STATS", "number.UNIT_TYPES"]
Provides = ["method._eff", "method._stage_construction", "method._stage_gather", "method._stage_industry", "method.build", "method.industry_upkeep", "number.BUILDINGS", "number.MAX_SLOTS", "number.SITE_BUILDING", "state.diplo_built", "state.energy_report", "state.grid_short"]

[[Stages]]
Id = "buildings.gather"
Handler = "_stage_gather"
Hook = "slot.02"
Needs = ["decisions.counted"]
Provides = ["resources.collected"]

[[Stages]]
Id = "buildings.industry"
Handler = "_stage_industry"
Hook = "slot.03"
Needs = ["resources.collected"]
Provides = ["resources.transformed"]

[[Stages]]
Id = "buildings.construction"
Handler = "_stage_construction"
Hook = "slot.13"
Needs = ["exchange.settled"]
Provides = ["projects.completed"]

[Manual]
Sources = ["manual-1.md", "manual-2.md"]
Hidden = ["十、政体：匈奴", "十二、终局结算"]

