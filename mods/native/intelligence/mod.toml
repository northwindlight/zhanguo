[Mod]
Id = "native:intelligence"
Version = "1.5.0"
Entry = "mods.native.intelligence.mod:IntelligenceMod"
Requires = ["native:nations", "native:government", "native:resources", "native:buildings", "native:diplomacy", "native:vision", "native:army"]
After = ["native:nations", "native:government", "native:army"]
[State]
Owns = ["intelligence"]
[Capabilities]
Needs = ["native:territory", "native:nation-inspection", "native:government", "native:resource-exchange", "native:resource-inspection", "native:buildings", "native:diplomacy", "native:vision", "native:army"]
Optional = ["economy:queries"]
Provides = ["native:intelligence"]
[Interfaces]
"economy:queries" = ["balance"]
"native:nation-inspection" = ["ids", "get"]
"native:government" = ["period"]
"native:resource-exchange" = ["exchange", "exchange_batch"]
"native:resource-inspection" = ["snapshot", "role_ids"]
"native:buildings" = ["snapshot"]
"native:diplomacy" = ["allied", "snapshot", "entity", "representative", "diplomatic_authority"]
"native:vision" = ["visible", "tiles"]
"native:army" = ["snapshot"]
"native:territory" = ["neighbors", "owner", "cell"]
[Intelligence]
Fee = 10
LetterBase = 20
LetterAlly = 10
LetterMinimum = 5
CenterDiscount = 5
FreeCharacters = 20
CharactersPerGold = 10
SpyFee = 100
SpyDelay = 3

[PlayerAPI]
Methods = ["letter", "gift", "map", "spy", "intel", "news", "dispatches", "countries"]
ReadOnly = ["countries", "dispatches", "intel", "news"]

[PlayerAPI.ContentParameters]
gift = ["resource"]

[PlayerAPI.Actions]
letter = "send_letter"
map = "share_map"
