[Mod]
Id = "native:vision"
Version = "1.3.1"
Entry = "mods.native.vision.mod:VisionMod"
Requires = ["native:territory", "native:diplomacy", "native:buildings"]
[Capabilities]
Needs = ["native:territory", "native:diplomacy", "native:buildings"]
Provides = ["native:vision"]
[Interfaces]
"native:territory" = ["dimensions", "check", "owned", "cell"]
"native:diplomacy" = ["entity", "members"]
"native:buildings" = ["effects", "kinds_with_role", "snapshot"]

[PlayerAPI]
Methods = ["tiles"]
ReadOnly = ["tiles"]
