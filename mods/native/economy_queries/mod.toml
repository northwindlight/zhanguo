[Mod]
Id = "native:economy-queries"
Version = "1.12.0"
Entry = "mods.native.economy_queries.mod:QueriesMod"
Requires = ["native:resources", "native:buildings", "native:market", "native:economy"]

[Capabilities]
Needs = ["native:resource-inspection", "native:buildings", "native:market", "native:economy", "economy:valuation"]
Optional = ["native:army", "native:diplomacy"]
Provides = ["economy:queries"]

[Interfaces]
"native:resource-inspection" = ["owners", "snapshot"]
"native:buildings" = ["replacement_costs", "demand_preview", "tribute_preview", "tribute_balances", "reserved_costs"]
"native:army" = ["supply_preview", "reserved_costs"]
"native:diplomacy" = ["snapshot"]
"native:economy" = ["reports", "turns", "production"]
"native:market" = ["summary", "quote", "buy", "sell", "equilibrium", "trials", "set_auto_trade", "remove_auto_trade", "auto_trades"]
"economy:valuation" = ["quote"]

[PlayerAPI]
Methods = ["balance", "report", "estimate", "market", "trade_quote", "buy", "sell", "auto_trade", "remove_auto_trade"]
ReadOnly = ["balance", "estimate", "market", "report", "trade_quote"]

[PlayerAPI.ContentParameters]
buy = ["resource"]
sell = ["resource"]
estimate = ["kind"]
trade_quote = ["resource"]
auto_trade = ["resource"]
remove_auto_trade = ["resource"]
