Currency = "native:gold"

# Depth 是名义市场深度：基准库存从这里起步，每期按净流量偏移 Flow 倍，报价以它为尺度。
# Refill=0：外部不再回补，InitialInventory 是市场唯一一次发货，之后库存只由买卖改变。
[Buffer]
Elasticity = 1.0
Flow = 0.25
Refill = 0.0
Spread = 0.10
MinPrice = 0.000001
MaxPrice = 1000000000.0

[[Listings]]
Resource = "native:food"
BasePrice = 1.5
Depth = 1920
InitialInventory = 1920
[[Listings]]
Resource = "native:wood"
BasePrice = 2
Depth = 1920
InitialInventory = 1920
[[Listings]]
Resource = "native:ore"
BasePrice = 2.5
Depth = 1280
InitialInventory = 1280
[[Listings]]
Resource = "native:oil"
BasePrice = 6
Depth = 960
InitialInventory = 960
[[Listings]]
Resource = "native:equipment"
BasePrice = 8
Depth = 640
InitialInventory = 640
[[Listings]]
Resource = "native:supply"
BasePrice = 6
Depth = 960
InitialInventory = 960

[Mod]
Id = "native:market"
Version = "2.2.0"
Entry = "mods.native.market.mod:MarketMod"
Requires = ["native:resources"]
After = ["native:resources"]

[State]
Owns = ["market"]
Requests = []

[Capabilities]
Needs = ["native:resource-exchange", "market:pricing"]
Provides = ["native:market"]

[Interfaces]
"native:resource-exchange" = ["exchange", "snapshot"]
"market:pricing" = ["walk", "level"]

[[Stages]]
Id = "native:market.settle"
Hook = "market.settlement"
Provides = ["market.settled"]
