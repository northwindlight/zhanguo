[Mod]
Id = "native:diplomacy"
Version = "2.0.0"
Entry = "mods.native.diplomacy.mod:DiplomacyMod"
Requires = ["native:nations", "native:government", "native:resources", "native:buildings"]
After = ["native:nations", "native:government"]
[State]
Owns = ["diplomacy"]
[Capabilities]
Needs = ["native:nation-inspection", "native:government", "native:resource-inspection", "native:resource-exchange", "native:buildings"]
Provides = ["native:diplomacy"]
[Interfaces]
"native:nation-inspection" = ["ids", "get"]
"native:government" = ["period"]
"native:resource-inspection" = ["snapshot"]
"native:resource-exchange" = ["exchange", "exchange_batch"]
"native:buildings" = ["snapshot"]
[Diplomacy]
Fee = 10
MinimumFee = 1
NameMax = 12
FallTruce = 10
