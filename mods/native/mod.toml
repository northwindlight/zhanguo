[Distribution]
Id = "native"
Version = "4.8.1"
Members = ["handbooks/mod.toml", "../ui/mod.toml", "resources/mod.toml", "buildings/mod.toml", "market_pricing/mod.toml", "market/mod.toml", "economy_valuation/mod.toml", "economy_reports/mod.toml", "bank/mod.toml", "economy_queries/mod.toml", "nations/mod.toml", "government/mod.toml", "map_generation/mod.toml", "territory/mod.toml", "diplomacy/mod.toml", "vision/mod.toml", "army/mod.toml", "succession/mod.toml", "intelligence/mod.toml", "query/mod.toml", "polities/huns/mod.toml"]
RequiredState = ["resources", "buildings", "market", "economy", "bank", "nations", "government", "territory", "diplomacy", "units", "military", "succession", "intelligence"]
ActorCollection = "nation_actors"
ActionGate = {Capability = "native:government", Method = "can_act"}
PlayerClock = {Capability = "native:government", Method = "period"}
PlayerEvents = "news"
# 模型侧只读面板收敛到这一个分发器；其余只读工具照旧注册，但不进工具表。
ReadOnlyPanel = "query"

[Distribution.Tools]
Entry = "mods.native.tools:build"

[[Hooks]]
Id = "cycle.start"
Name = "计票"
Description = "开放两周期的联盟投票按当前成员名单统一计票。"

[[Hooks]]
Id = "buildings.production"
Name = "建筑生产"
Description = "采集、燃料发电、电网和工业按实际投入结算。"

[[Hooks]]
Id = "relations"
Name = "外交与派发"
Description = "重验外交命令，生效或退费；派出信使。"

[[Hooks]]
Id = "military.supply"
Name = "补给与恢复"
Description = "补给不足先扣HP；无战斗且补给满足时消耗装备恢复。"

[[Hooks]]
Id = "military.battle"
Name = "战斗"
Description = "各方掷骰，同时承伤并裁决即时占领。"

[[Hooks]]
Id = "military.withdraw"
Name = "撤退落地"
Description = "幸存的待撤军队落地，受阻时改撤或留守。"

[[Hooks]]
Id = "military.claims"
Name = "弃城与占领"
Description = "按进场顺序占领守军尽撤的地块。"

[[Hooks]]
Id = "succession"
Name = "国祚与强制和平"
Description = "市政厅尽失者亡国，清国有地交战并建立强制休战。"

[[Hooks]]
Id = "military.repatriate"
Name = "遣返与脱离清扫"
Description = "非法滞留军向本国或盟国返还；清理空交战标记并检查不变量。"

[[Hooks]]
Id = "market.settlement"
Name = "市场结算"
Description = "只结算本期成交，更新库存基准与下一期开盘报价。"

[[Hooks]]
Id = "buildings.completion"
Name = "施工完成"
Description = "本期在建落成，下期开始生产。"

[[Hooks]]
Id = "bank.settlement"
Name = "央行结算"
Description = "存款利息、贷款复利和到期扣款；亡国账户不再结息。"

[[Hooks]]
Id = "economy.reports"
Name = "经济报表"
Description = "按此时行情记录事实、累计四类消费并公布周期报表。"

[[Hooks]]
Id = "cycle.end"
Name = "事件与送达"
Description = "落下公开/私有事件并送达已到期信使，然后进入下一周期。"

[Distribution.Session]
Entry = "mods.native.session:NativeSession"
Observer = { Capability = "native:intelligence", Records = "records", Announce = "announce", Send = "send" }

[Distribution.Scenarios.eight_nations]
Entry = "mods.native.scenarios.eight_nations:EightNations"

[Distribution.Configuration]
Entry = "mods.native.config:normalize"

[Distribution.ClientFactories.llm]
Configuration = "clients.config:normalize"

[Distribution.ClientFactories.rule]
Configuration = "ruleai:normalize_config"
