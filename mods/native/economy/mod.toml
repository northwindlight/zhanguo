ReadOnlyTools = ["report", "econ"]
ToolNames = ["econ", "report", "loan", "buy_report", "buy", "sell"]
[Mod]
Id = "economy"
Version = "1.0.0"
Entry = "mods.native.economy.mod:EconomyMod"
Requires = []

[State]
Requests = ["econ_intel", "energy_report", "tiles", "turn"]
Owns = ["bank", "churn", "econ_reports", "econ_summary", "equilibrium", "flow_in", "flow_out", "gdp_run", "gold_carry", "ledger", "nations", "order", "prices", "spend"]

[Capabilities]
Needs = ["method.add_res", "method.alive", "method.broadcast", "method.industry_upkeep", "method.log", "method.nation_armies", "method.nation_building_count", "method.res", "number.BUILDINGS", "number.DIPLO_COST", "number.MAX_SLOTS", "number.UNIT_TYPES"]
Provides = ["method._bank_settle", "method._clamp_price", "method._close_report_period", "method._flows_gdp", "method._growth", "method._ledger", "method._ledger_runrate_mark", "method._mval", "method._record_trade", "method._remove_pair", "method._settle_gold", "method._spend", "method._stage_bank", "method._stage_market", "method._stage_reports", "method._turn_flows", "method._update_market", "method.bank_credit", "method.bank_enable", "method.bank_loan", "method.bank_loan_rate", "method.bank_on", "method.bank_rate", "method.bank_sell_report", "method.bank_set_rate", "method.buy", "method.churn_brief", "method.churn_loss", "method.churn_note", "method.churn_state", "method.market_depth", "method.market_price", "method.market_quote", "method.market_tick", "method.market_walk", "method.nation_assets", "method.nation_gdp", "method.price_floor", "method.sell", "method.spend_total", "number.BANK_LOAN_GDP_MULT", "number.BANK_LOAN_TURNS", "number.BANK_RATE_MAX", "number.BANK_RATE_MIN", "number.BANK_SPREAD", "number.BUY_REPORT_COST", "number.GOODS", "number.GRID_RESERVE_WARN", "number.MARKET", "number.MARKET_DEPTH", "number.MARKET_DEPTH_NATIONS_DIV", "number.MARKET_EQ_MAX_RATIO", "number.MARKET_EQ_MIN_RATIO", "number.MARKET_GAP_ONE_SIDE", "number.MARKET_SENS", "number.MARKET_SPREAD", "number.PRICE_IMPACT", "number.PRICE_MAX_RATIO", "number.PRICE_MIN_ABS", "number.PRICE_MIN_RATIO", "number.PRICE_REVERT", "number.REPORT_EVERY", "number.RES_KEYS", "number.RES_LABEL", "number.START_RES", "number.TRADEABLE", "state.bank", "state.churn", "state.econ_reports", "state.econ_summary", "state.equilibrium", "state.flow_in", "state.flow_out", "state.gdp_run", "state.gold_carry", "state.ledger", "state.nations", "state.order", "state.prices", "state.spend"]

[[Stages]]
Id = "economy.market"
Handler = "_stage_market"
Hook = "slot.12"
Needs = ["units.repatriated"]
Provides = ["exchange.settled"]

[[Stages]]
Id = "economy.bank"
Handler = "_stage_bank"
Hook = "slot.14"
Needs = ["projects.completed"]
Provides = ["interest.accrued"]

[[Stages]]
Id = "economy.reports"
Handler = "_stage_reports"
Hook = "slot.15"
Needs = ["interest.accrued"]
Provides = ["reports.published"]

[Manual]
Sources = ["manual-1.md", "manual-2.md"]
Hidden = ["十、政体：匈奴", "十二、终局结算"]

