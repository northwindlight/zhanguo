[Distribution]
Id = "example:tea-dist"
Version = "1.0.0"
# 添加一种可交易资源的发行版：在 native 的成员表上改两处 ——
#   · ../../native/market/mod.toml 换成 ../tea/market.toml（多一条商品声明）；
#   · 增加 ../tea/mod.toml（注册该资源）。
# 其余成员、挂点、RequiredState、PlayerState 与 native 一致。
Members = [
  "../../native/resources/mod.toml",
  "../../native/buildings/mod.toml",
  "../tea/market.toml",
  "../../native/market_pricing/mod.toml",
  "../../native/economy_valuation/mod.toml",
  "../../native/economy_reports/mod.toml",
  "../../native/bank/mod.toml",
  "../../native/economy_queries/mod.toml",
  "../../native/nations/mod.toml",
  "../../native/government/mod.toml",
  "../../native/map_generation/mod.toml",
  "../../native/territory/mod.toml",
  "../../native/diplomacy/mod.toml",
  "../../native/vision/mod.toml",
  "../../native/army/mod.toml",
  "../../native/succession/mod.toml",
  "../../native/intelligence/mod.toml",
  "../tea/mod.toml",
  "../../native/polities/huns/mod.toml",
]
RequiredState = ["resources", "buildings", "market", "economy", "bank", "nations", "government",
                 "territory", "diplomacy", "units", "military", "succession", "intelligence"]
ActorCollection = "nation_actors"
ActionGate = {Capability = "native:government", Method = "can_act"}
PlayerClock = {Capability = "native:government", Method = "period"}
PlayerState = ["government", "nation", "nations", "econ", "bank", "land", "building_sites", "view",
               "army", "diplomacy", "intel", "news", "dispatches", "market"]
PlayerEvents = "news"

[[Hooks]]
Id = "cycle.start"
[[Hooks]]
Id = "buildings.production"
[[Hooks]]
Id = "relations"
[[Hooks]]
Id = "military.supply"
[[Hooks]]
Id = "military.battle"
[[Hooks]]
Id = "military.withdraw"
[[Hooks]]
Id = "military.claims"
[[Hooks]]
Id = "succession"
[[Hooks]]
Id = "military.repatriate"
[[Hooks]]
Id = "market.settlement"
[[Hooks]]
Id = "buildings.completion"
[[Hooks]]
Id = "bank.settlement"
[[Hooks]]
Id = "economy.reports"
[[Hooks]]
Id = "cycle.end"

[Distribution.Session]
Entry = "mods.native.session:NativeSession"
Observer = { Capability = "native:intelligence", Records = "to_save", Announce = "announce", Send = "send" }
