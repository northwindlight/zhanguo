[Distribution]
Id = "experimental"
Version = "0.4.0-beta.1"
Members = ["combat_research/mod.toml", "../ui/mod.toml", "../native/resources/mod.toml", "../native/buildings/mod.toml", "market_pricing.toml", "market.toml", "../native/economy_valuation/mod.toml", "../native/economy_reports/mod.toml", "../native/bank/mod.toml", "market_queries.toml", "../native/nations/mod.toml", "government.toml", "scripting.toml", "../native/map_generation/mod.toml", "../native/territory/mod.toml", "../native/diplomacy/mod.toml", "../native/vision/mod.toml", "../native/army/mod.toml", "../native/succession/mod.toml", "../native/intelligence/mod.toml", "../native/polities/huns/mod.toml"]
RequiredState = ["resources", "buildings", "market", "economy", "bank", "nations", "government", "territory", "diplomacy", "units", "military", "succession", "intelligence", "scripts"]
ActorCollection = "nation_actors"
ActionGate = {Capability = "native:government", Method = "can_act"}
PlayerClock = {Capability = "native:government", Method = "period"}
PlayerState = ["government", "nation", "nations", "econ", "bank", "land", "building_sites", "view", "army", "diplomacy", "intel", "news", "dispatches", "market", "script_status"]
PlayerEvents = "news"

[Distribution.ClientFactories.llm]
Configuration = "clients.config:normalize"
Entry = "mods.experimental.client:ParliamentClient"
[Distribution.Session.Services.council]
Configuration = "mods.experimental.config:normalize"
Entry = "mods.experimental.council:CouncilService"
[Distribution.Session.Services.council.Services.government]
Capability = "native:government"
Methods = ["enroll", "decide", "replace"]

[Distribution.Session.Services.scripts]
Entry = "mods.experimental.scripting:ScriptService"
[Distribution.Session.Services.scripts.Services.programs]
Capability = "sandbox:programs"
Methods = ["finish"]

[[Hooks]]
Id = "cycle.start"

[[Hooks]]
Id = "buildings.production"

[[Hooks]]
Id = "relations"

[[Hooks]]
Id = "military.supply"

[[Hooks]]
Id = "military.battle"

[[Hooks]]
Id = "military.withdraw"

[[Hooks]]
Id = "military.claims"

[[Hooks]]
Id = "succession"

[[Hooks]]
Id = "military.repatriate"

[[Hooks]]
Id = "market.settlement"

[[Hooks]]
Id = "buildings.completion"

[[Hooks]]
Id = "bank.settlement"

[[Hooks]]
Id = "economy.reports"

[[Hooks]]
Id = "cycle.end"

[Distribution.Session]
Entry = "mods.native.session:NativeSession"
Observer = { Capability = "native:intelligence", Records = "to_save", Announce = "announce", Send = "send" }

[Distribution.Configuration]
Entry = "mods.native.config:normalize"

[Distribution.ClientFactories.rule]
Entry = "mods.experimental.combat_research.client:ResearchRuleClient"
Configuration = "ruleai:normalize_config"

[Distribution.ClientFactories.rule.Services.combat]
Capability = "research:combat-probabilities"
Methods = ["assess"]
