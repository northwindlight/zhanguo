ToolNames = []
[Mod]
Id = "territory"
Version = "1.0.0"
Entry = "mods.native.territory.mod:TerritoryMod"
Requires = []

[State]
Requests = ["grid_short", "mailbox", "nations", "order", "token_usage"]
Owns = ["_mapgen", "_terr_grid", "max_turns", "rng", "seed", "size", "tiles"]

[Capabilities]
Needs = ["method._assign_code", "method._claim_winner", "method._conquer", "method._drop_guardians", "method._ensure_guardians", "method._settle_deaths", "method.bloc_of", "method.has_townhall", "method.log", "method.war_between", "number.BUILDINGS", "number.MAX_SLOTS"]
Provides = ["method.__init__", "method._check", "method._new_tile", "method._place_crosses", "method._place_ring", "method._seed_townhall", "method._stage_claims", "method._stage_deaths", "method._stamp_seen", "method.alive", "method.frontier_of", "method.mapgen", "method.nation_building_count", "method.neighbors", "method.own_tiles", "method.owned_by", "method.ter_char", "method.tile_resources", "method.tile_terrain", "method.visible_buildings", "method.visible_to", "number.ARRIVE_ATTEMPTS", "number.ARRIVE_MARGIN_DIV", "number.ARRIVE_MARGIN_MIN", "number.HUNS_RING_RATIO", "number.MAPGEN_BLUE_RADIUS", "number.MAPGEN_DRY", "number.MAPGEN_FADE", "number.MAPGEN_HILL", "number.MAPGEN_MTN", "number.MAPGEN_OCT_E", "number.MAPGEN_OCT_M", "number.MAPGEN_SCALE", "number.MAPGEN_SHIFT_MIX", "number.MAPGEN_WET", "number.RESOURCES", "number.RESOURCE_MAX", "number.TERRAINS", "number.TERRAIN_CHARS", "number.TERRAIN_STATS", "number.TERRAIN_WEIGHTS", "state._mapgen", "state._terr_grid", "state.max_turns", "state.rng", "state.seed", "state.size", "state.tiles"]

[[Stages]]
Id = "territory.claims"
Handler = "_stage_claims"
Hook = "slot.09"
Needs = ["conflicts.cleaned"]
Provides = ["property.settled"]

[[Stages]]
Id = "territory.deaths"
Handler = "_stage_deaths"
Hook = "slot.10"
Needs = ["property.settled"]
Provides = ["actors.eliminated"]

[Manual]
Sources = []
Hidden = ["十、政体：匈奴", "十二、终局结算"]

[Manual.Keywords]

