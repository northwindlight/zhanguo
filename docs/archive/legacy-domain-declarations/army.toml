[[Stages]]
Id = "army.disengage"
Handler = "_stage_disengage"
Hook = "slot.08"
Needs = ["units.repositioned"]
Provides = ["conflicts.cleaned"]

[[Stages]]
Id = "army.withdraw"
Handler = "_stage_withdraw"
Hook = "slot.11"
Needs = ["actors.eliminated"]
Provides = ["units.repatriated"]

