Provides = ["units.maintained"]

[[Stages]]
Id = "army.battle"
Handler = "_stage_battle"
Hook = "slot.06"
Needs = ["units.maintained"]
Provides = ["conflicts.resolved"]

[[Stages]]
Id = "army.retreats"
Handler = "_stage_retreats"
Hook = "slot.07"
Needs = ["conflicts.resolved"]
