<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战国 · 真人 GUI 素材</title><style>body{margin:0;background:#111f20;color:#e5dfbd;font:16px system-ui}header,nav,p{margin:20px 24px}h1{font-size:25px;color:#d3b965}button,a{background:#293e37;color:#e5dfbd;border:1px solid #61735a;padding:10px;cursor:pointer;margin:4px}button[aria-pressed=true]{border-color:#d3b965}img{display:block;width:min(1440px,100%);height:auto;margin:auto;image-rendering:pixelated}a{display:inline-block}small{color:#a7b39b}</style><header><h1>战国 · 真人 GUI 与情报地图</h1><small>合成设计样板，所有军队、国库、回合和外交状态均为示意；尚未接入游戏。</small></header><nav><button data-page="military-move" aria-pressed="true">移动与地块选军</button><button data-page="military-attack" aria-pressed="false">攻击与迷雾尝试</button><button data-page="intelligence-map" aria-pressed="false">情报与地图快照</button><button data-page="diplomacy-alliance" aria-pressed="false">外交与联盟</button><button data-page="catalog" aria-pressed="false">素材图录</button></nav><img id="preview" src="military-move.png" alt="移动与地块选军合成样板"><p><a id="source" href="military-move.svg">查看 / 保存 SVG 母版</a></p><script>for(const b of document.querySelectorAll("button")){b.onclick=()=>{for(const n of document.querySelectorAll("button"))n.setAttribute("aria-pressed",n===b);document.querySelector("img").src=b.dataset.page+".png";document.querySelector("img").alt=b.textContent+"合成样板";document.querySelector("#source").href=b.dataset.page+".svg"}}</script></html>
