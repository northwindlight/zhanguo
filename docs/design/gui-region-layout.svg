x="924" y="174" font-size="19" fill="#273d36">山体主体</text><text x="924" y="202" font-size="13" fill="#687566">山脊、岩壁和投影形成连续山势。</text><path d="M 213,307 L 845,307 L 884,288 L 909,288" stroke="#667e70" stroke-width="1.5" fill="none" /><circle cx="213" cy="307" r="4" fill="#536f62" /><text x="924" y="280" font-size="19" fill="#273d36">裸露金矿</text><text x="924" y="308" font-size="13" fill="#687566">金色矿脉嵌在露岩中。</text><path d="M 413,417 L 845,417 L 884,394 L 909,394" stroke="#667e70" stroke-width="1.5" fill="none" /><circle cx="413" cy="417" r="4" fill="#536f62" /><text x="924" y="386" font-size="19" fill="#273d36">谷地城市</text><text x="924" y="414" font-size="13" fill="#687566">小型房舍与街巷沿谷地展开。</text><path d="M 638,337 L 845,337 L 884,500 L 909,500" stroke="#667e70" stroke-width="1.5" fill="none" /><circle cx="638" cy="337" r="4" fill="#536f62" /><text x="924" y="492" font-size="19" fill="#273d36">独立城堡</text><text x="924" y="520" font-size="13" fill="#687566">台地选址，保留通道和周边空地。</text><path d="M 548,494 L 845,494 L 884,606 L 909,606" stroke="#667e70" stroke-width="1.5" fill="none" /><circle cx="548" cy="494" r="4" fill="#536f62" /><text x="924" y="598" font-size="19" fill="#273d36">迷你军团</text><text x="924" y="626" font-size="13" fill="#687566">队形表达规模，人物尺寸保持小。</text><path d="M 747,566 L 845,566 L 884,712 L 909,712" stroke="#667e70" stroke-width="1.5" fill="none" /><circle cx="747" cy="566" r="4" fill="#536f62" /><text x="924" y="704" font-size="19" fill="#273d36">植被与资源</text><text x="924" y="732" font-size="13" fill="#687566">同一地形也有疏密与资源差异。</text><text x="42" y="921" font-size="18" fill="#273d36">规则只认识一个地块；谷地内的小路、人物站位和房屋组合由呈现层安排。</text><text x="42" y="957" font-size="15" fill="#667568">布局保持稳定；建造优先填充预留位置，镜头缩放和刷新不会让整片聚落重新随机摆放。</text><text x="42" y="993" font-size="15" fill="#667568">山地格内的山体比例、城市密度和角色像素尺寸，须通过正式素材样板确认。</text></svg>